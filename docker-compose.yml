services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./m5.duckdb:/app/m5.duckdb:ro

  mlflow:
    build: .
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow-init:
    build: .
    depends_on:
      - airflow-postgres
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      M5_PROJECT_DIR: /app
      M5_PYTHON_BIN: python
    command: bash -c "pip install -q apache-airflow==2.10.5 psycopg2-binary && airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    volumes:
      - .:/app
      - airflow_home:/root/airflow

  airflow-webserver:
    build: .
    depends_on:
      - airflow-init
    environment: *airflow_env
    command: bash -c "pip install -q apache-airflow==2.10.5 psycopg2-binary && airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./airflow/dags:/root/airflow/dags
      - airflow_home:/root/airflow

  airflow-scheduler:
    build: .
    depends_on:
      - airflow-init
    environment: *airflow_env
    command: bash -c "pip install -q apache-airflow==2.10.5 psycopg2-binary && airflow scheduler"
    volumes:
      - .:/app
      - ./airflow/dags:/root/airflow/dags
      - airflow_home:/root/airflow

volumes:
  airflow_pg_data:
  airflow_home:
